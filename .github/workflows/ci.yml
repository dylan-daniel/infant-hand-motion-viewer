name: CI

on:
  push:
    branches: [main, dev, preview]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libfreetype-dev libgtk-3-dev libxkbcommon-dev libwayland-dev
      - name: macOS deps
        if: runner.os == 'macOS'
        run: brew install freetype pkg-config
      - name: Windows deps
        if: runner.os == 'Windows'
        run: cargo install cargo-vcpkg && cargo vcpkg build
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test
