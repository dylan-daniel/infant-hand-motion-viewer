name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            bin: infant-hand-motion-viewer
          - os: macos-latest
            name: macos-arm64
            bin: infant-hand-motion-viewer
          - os: windows-latest
            name: windows-x86_64
            bin: infant-hand-motion-viewer.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libfreetype-dev libgtk-3-dev libxkbcommon-dev libwayland-dev
      - name: macOS deps
        if: runner.os == 'macOS'
        run: brew install freetype pkg-config
      - name: Windows deps
        if: runner.os == 'Windows'
        run: cargo install cargo-vcpkg && cargo vcpkg build
      - run: cargo test
      - run: cargo build --release
      - name: Package
        shell: bash
        run: |
          ext="${{ matrix.bin }}"; ext="${ext##*.}"; [ "$ext" = "exe" ] && suffix=".exe" || suffix=""
          cp target/release/${{ matrix.bin }} "infant-hand-motion-viewer-${{ github.ref_name }}-${{ matrix.name }}$suffix"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: infant-hand-motion-viewer-*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: sha256sum infant-hand-motion-viewer-* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            infant-hand-motion-viewer-*
            SHA256SUMS
          generate_release_notes: true
