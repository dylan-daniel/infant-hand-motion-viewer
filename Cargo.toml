[package]
name = "infant-hand-motion-viewer"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
byteorder = "1.5.0"
crossbeam-channel = "0.5.17"
dear-imgui-rs = { version = "0.18.0", features = ["glam", "freetype"] }
dear-imgui-sys = { version = "0.18.0", features = ["vcpkg"] }
dear-imgui-wgpu = "0.18.0"
dear-imgui-winit = "0.18.0"
flate2 = "1.1.10"
glam = "0.33.8"
image = "0.25.10"
pollster = "0.4"
raw-window-handle = "0.6.2"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
winit = "0.30"
zip = { version = "2.4.2", default-features = false, features = ["deflate", "deflate-flate2"] }

# Windows has no pkg-config; `cargo install cargo-vcpkg && cargo vcpkg build` fetches and builds FreeType into target/vcpkg.
[package.metadata.vcpkg]
git = "https://github.com/microsoft/vcpkg"
rev = "5f96cd15fd745122cf27e0524606d6c1efc5fd07"
dependencies = ["freetype"]

[package.metadata.vcpkg.target]
x86_64-pc-windows-msvc = { triplet = "x64-windows-static-md" }
