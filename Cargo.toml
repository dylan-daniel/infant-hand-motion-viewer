[package]
name = "infant-hand-motion-viewer"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
byteorder = "1.5.0"
crossbeam-channel = "0.5.17"
dear-imgui-glow = "0.18.0"
dear-imgui-rs = { version = "0.18.0", features = ["glam", "freetype"] }
dear-imgui-winit = "0.18.0"
flate2 = "1.1.10"
glam = "0.33.8"
glow = "0.18"
glutin = "0.32.3"
glutin-winit = "0.5.0"
image = "0.25.10"
raw-window-handle = "0.6.2"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
winit = "0.30"
zip = { version = "2.4.2", default-features = false, features = ["deflate", "deflate-flate2"] }
